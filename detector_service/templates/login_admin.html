<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centinela · Acceso administrador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0E14;
    --bg-panel: #0F141C;
    --bg-panel-raised: #141B25;
    --line: #22303F;
    --text: #D6E1EA;
    --text-dim: #6E828F;
    --danger: #F07178;
    --accent: #39BAE6;
    --font-head: 'Space Grotesk', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg); color: var(--text); font-family: var(--font-mono);
    min-height: 100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width: 380px;
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 32px 28px;
  }
  .card h1{ font-family: var(--font-head); font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .card p.sub{ font-size: 12.5px; color: var(--text-dim); margin-bottom: 26px; }
  label{ font-size: 11.5px; color: var(--text-dim); display:block; margin-bottom: 6px; }
  input{
    width:100%; background: var(--bg-panel-raised); border: 1px solid var(--line);
    color: var(--text); font-family: var(--font-mono); font-size: 13px;
    padding: 10px 12px; border-radius: 4px; margin-bottom: 16px;
  }
  input:focus{ outline: none; border-color: var(--accent); }
  button{
    width:100%; background: var(--accent); color: #0A0E14; border: none;
    font-family: var(--font-head); font-size: 13.5px; font-weight: 700;
    padding: 11px; border-radius: 4px; cursor: pointer; transition: opacity .15s ease;
  }
  button:hover{ opacity: 0.9; }
  button:disabled{ opacity: 0.5; cursor: not-allowed; }
  #error{
    margin-top: 10px; font-size: 12.5px; padding: 10px 12px; border-radius: 4px;
    display: none;
  }
  #error.visible{ display:block; background: rgba(240,113,120,0.1); color: var(--danger); border: 1px solid rgba(240,113,120,0.3); }
</style>
</head>
<body>
<div class="card">
  <h1>Acceso administrador</h1>
  <p class="sub">Introduce la contraseña maestra para acceder al panel de Centinela.</p>
  <form id="form-login" method="POST" action="/login-admin">
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus>
    <button type="submit" id="btn-submit">Acceder</button>
  </form>
  {% if error %}<div id="error" class="visible">{{ error }}</div>{% else %}<div id="error"></div>{% endif %}
</div>
<script>
document.getElementById('form-login').addEventListener('submit', async (e) => {
  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = 'Verificando...';
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('error');
  e.preventDefault();
  try {
    const res = await fetch('/login-admin', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      credentials: 'same-origin',
      body: JSON.stringify({password})
    });
    const data = await res.json().catch(()=> ({}));
    if (res.ok && data && data.status === 'ok') {
      // Redirige explícitamente al dashboard (no location.reload) para
      // forzar un GET limpio con la cookie session recién guardada.
      window.location.href = data.redirect || '/';
    } else {
      errEl.textContent = (data && data.error) ? data.error : 'Error al autenticar';
      errEl.classList.add('visible');
      btn.disabled = false; btn.textContent = 'Acceder';
    }
  } catch (err) {
    errEl.textContent = 'No se pudo contactar con el servidor.';
    errEl.classList.add('visible');
    btn.disabled = false; btn.textContent = 'Acceder';
  }
});
</script>
</body>
</html>
