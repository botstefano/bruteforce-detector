name: Centinela V4 validation

on:
  pull_request:
    branches:
      - feature/centinela-v3-automated-lab
  push:
    branches:
      - feature/centinela-v4-empirical-collection

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
