name: Centinela v3 CI

on:
  push:
    branches:
      - feature/centinela-v3-automated-lab
  pull_request:
    branches:
      - master
      - fix/supabase-event-audit

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-empirical.txt
      - name: Install empirical evaluation dependencies
        run: python -m pip install -r requirements-empirical.txt
      - name: Validate offline evaluator syntax
        run: python -m py_compile empirical_auth_evaluation.py
      - name: Empirical feature schema tests
        run: python -m unittest discover -s tests -v
