# ============================================================
# Blueprint Render — Centinela v2 Detector (Node.js + TypeScript)
# ============================================================
services:
  - type: web
    name: centinela-v2-detector
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .

    region: oregon
    plan: free
    numInstances: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DURACION_BLOQUEO_SEGUNDOS
        value: 300
      - key: ALLOWED_ORIGINS
        value: "*"

    autoDeploy: true
    healthCheckPath: /health
