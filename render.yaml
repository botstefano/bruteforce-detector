# ============================================================
# Blueprint Render — Centinela v2 Detector (PLAN FREE)
# MODO DOCKER: evita 100% los comportamientos ocultos del
# buildpack Python de Render (pip install automático previo
# al buildCommand, variables persistidas no sincronizables,
# falta de gfortran en imagen base sdist-build, etc.)
#
# NOTAS SOBRE FREE TIER (léelas antes de desplegar):
#   · Render Free NO admite "disk:" persistente → la DB SQLite vive
#     en /data del contenedor (efímero: se borra al dormir/reiniciar).
#   · Idle timeout: 15 min SIN tráfico → la instancia se duerme.
#     Al despertar: se BORRAN bloqueos, eventos y el modelo ML vuelve
#     a sintético (no hay persistencia).
#   · Socket.IO del dashboard se desconecta al dormir; refresca
#     manualmente la página cuando reingreses.
#   · El build Docker tarda ~4-7 min la PRIMERA vez (descarga imagen
#     python slim + wheels manylinux). Los siguientes builds usan
#     layer cache y tardan ~1-2 min.
#
# Si luego quieres pasar a plan Starter ($7/mes) y recuperar la
# persistencia real, añade la sección "disk:" abajo indicada y
# reinicia el servicio.
#
# USO: Render > New + > Blueprint > selecciona tu repo
# IMPORTANTE: después del primer deploy entra al servicio y
# configura "DASHBOARD_PASSWORD" manualmente en Environment
# (el blueprint la marca sync:false para que no se pierda).
# ============================================================
services:
  - type: web
    name: centinela-v2-detector
    # -----------------------------
    # MODO DOCKER (en vez de env:python)
    # -----------------------------
    env: docker
    dockerfilePath: ./Dockerfile         # Dockerfile en la raíz
    dockerContext: .                     # Contexto de build = raíz del repo

    region: oregon
    plan: free              # FREE TIER — sin tarjeta, pero con idle + sin persistencia
    numInstances: 1          # IMPRESCINDIBLE: 1 sola instancia para Socket.IO (sin Redis pub/sub)

    # ------------------------------------------------------------------
    # ⚠️ En modo DOCKER se IGNORA buildCommand / startCommand del YAML:
    #    - Build se toma de los "RUN ..." del Dockerfile (incluyendo
    #      pip install con --only-binary para numpy/scipy/sklearn/pandas).
    #    - Runtime se toma del CMD/ENTRYPOINT del Dockerfile (el CMD
    #      ya usa ${PORT:-5050} para respetar el puerto dinámico de Render).
    # ------------------------------------------------------------------

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # ------------------------------------------------------------------
      # Runtime env vars (el Dockerfile ya tiene defaults en ENV pero
      # el Blueprint/Sync puede sobreescribirlas aquí si hace falta).
      # NOTA: PIP_* no hace falta aquí en modo Docker — los seteamos
      # dentro del propio Dockerfile para que se apliquen DURANTE el
      # build de la imagen (cuando pip realmente corre).
      # ------------------------------------------------------------------
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DASHBOARD_PASSWORD
        sync: false            # Configúrala manualmente tras el deploy (NUNCA la comitees)
      - key: DURACION_BLOQUEO_SEGUNDOS
        value: 300
      - key: TRUSTED_PROXIES
        value: render
      - key: SOCKETIO_ASYNC_MODE
        value: eventlet
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "Lax"
      - key: PERMITIR_LOCALHOST_BOT
        value: "0"
      - key: DB_PATH
        value: /data/centinela_eventos.db   # Free tier: /data del container (efímero)
      - key: ALLOWED_ORIGINS
        value: "*"             # Cambia por https://TU_SUBDOMINIO.onrender.com para mayor seguridad

    # ------------------------------------------------------------------
    # PERSISTENCIA OPCIONAL (SÓLO PLAN STARTER $7/mes O SUPERIOR):
    # Descomenta el bloque de abajo para disco 1GB persistente y
    # recuerda que DB_PATH ya apunta a /data para esto.
    # En plan FREE Render ignora silenciosamente la sección "disk:"
    # y /data seguirá siendo efímero.
    #
    # disk:
    #   name: centinela-data
    #   mountPath: /data
    #   sizeGB: 1
    # ------------------------------------------------------------------

    autoDeploy: true
    healthCheckPath: /health
